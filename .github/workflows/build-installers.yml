name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.2.1) — leave blank to use git tag'
        required: false
        default: ''

jobs:
  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .app bundle
        run: |
          python -m PyInstaller \
            --clean --noconfirm \
            installers/macos/octoslave.spec

      - name: Codesign (ad-hoc)
        run: |
          codesign --force --deep --sign - dist/OctoSlave.app || true

      - name: Build DMG
        run: bash installers/macos/build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoSlave-macOS
          path: dist/OctoSlave-macOS.dmg

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows installer
        shell: cmd
        run: installers\windows\build_installer.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoSlave-Windows
          path: dist/OctoSlave-Windows-Installer.exe

  # ── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 tk-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Get appimagetool
        run: |
          wget -q -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        run: bash installers/linux/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoSlave-Linux
          path: dist/OctoSlave-x86_64.AppImage

  # ── Release ──────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/OctoSlave-macOS/*.dmg
            artifacts/OctoSlave-Windows/*.exe
            artifacts/OctoSlave-Linux/*.AppImage
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
